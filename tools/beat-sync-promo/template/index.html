<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Beat-sync Promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@500;600&display=block" rel="stylesheet">
<style>
:root{--paper:#F2F3EF;--ink:#0B0B0C;--dark:#0A0A0B;--accent:#C9F65A;--mute:#8C8C90;--line:#E2E3DE}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:"Inter","PingFang SC","Noto Sans SC","Hiragino Sans GB",sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--dark)}
.sec{position:absolute;inset:0;display:none}
.cam{position:absolute;inset:0;transform-origin:960px 540px}
.mask{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .04em .08em}
.mask>.in{display:inline-block;will-change:transform}

/* hook */
#s-hook{background:transparent}
#paper{position:absolute;inset:0;background:var(--paper)}
#hookLine{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:.5em;font-size:104px;font-weight:600;letter-spacing:-.02em;color:var(--ink);line-height:1.1}
.tag{display:inline-block;background:var(--accent);color:var(--ink);padding:0 .14em;border-radius:.14em;line-height:1.2}
#docWord .hl{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--accent);border-radius:.14em;transform-origin:0 50%}
#docWord{position:relative;display:inline-block;padding:0 .14em;line-height:1.2}
#docWord .t{position:relative}
#fly{position:absolute;z-index:10;left:0;top:0;font-size:104px;font-weight:600;letter-spacing:-.02em;transform-origin:0 0;display:none;white-space:nowrap}

/* ui */
#s-ui{background:var(--paper)}
#uiFade{position:absolute;inset:0}
#card{position:absolute;left:440px;top:210px;width:1040px;height:660px;background:#fff;border:1px solid var(--line);border-radius:30px;box-shadow:0 30px 80px -40px rgba(20,24,20,.18);padding:52px 60px}
.uihead{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px}
.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
.uihead .r{font-size:17px;color:var(--mute);font-weight:500}
.lbl{font-size:16px;color:var(--mute);font-weight:500;margin-bottom:12px;letter-spacing:.02em}
#drop{height:112px;border:1.5px dashed #CFD1CA;border-radius:20px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;margin-bottom:38px}
#chip{display:flex;align-items:center;gap:16px;font-size:26px;font-weight:600;letter-spacing:-.02em;color:var(--ink)}
#chipTag{font-size:22px;font-weight:600;letter-spacing:-.02em}
#drop .r{font-size:16px;color:var(--mute)}
.row2{display:flex;gap:40px;margin-bottom:44px}
#field{width:430px;height:66px;border:1.5px solid #DADCD5;border-radius:16px;display:flex;align-items:center;padding:0 22px;font-size:24px;font-weight:500;color:var(--ink)}
#caret{display:inline-block;width:2px;height:28px;background:var(--ink);margin-left:3px}
.chips{display:flex;gap:12px}
.vchip{height:66px;padding:0 24px;border-radius:33px;border:1.5px solid #DADCD5;display:flex;align-items:center;font-size:20px;font-weight:500;color:var(--ink)}
.foot{display:flex;align-items:center;justify-content:space-between}
.foot .note{font-size:16px;color:var(--mute)}
#btn{height:70px;width:220px;border-radius:35px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:23px;font-weight:600;letter-spacing:-.01em}
#cursor{position:absolute;z-index:11;left:0;top:0;width:34px;height:34px;transform-origin:4px 3px;display:none}
#iris{position:absolute;z-index:12;display:none}

/* wall */
#wallCam{transform-origin:960px 540px}
.tile{position:absolute;width:162px;height:288px;border-radius:10px;overflow:hidden;background:#141416}
.tile img,.card img,#screen img{width:100%;height:100%;object-fit:cover;display:block}
.tile .dim{position:absolute;inset:0;background:#000}
.tile .flash{position:absolute;inset:0;background:#fff}
.tile .ring{position:absolute;inset:0;border-radius:10px;box-shadow:inset 0 0 0 3px var(--accent)}
#scan{position:absolute;top:70px;height:940px;width:2px;background:var(--accent)}
#scanTrail{position:absolute;top:70px;height:940px;width:220px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.07))}

/* key text */
.big{position:absolute;left:0;right:0;text-align:center;font-weight:600;color:#fff;letter-spacing:-.025em;line-height:1.08}
#kt{top:50%;transform:translateY(-50%);font-size:168px}
#kt .line{display:block}

/* carousel */
#carBlur{position:absolute;inset:0}
#carPersp{position:absolute;inset:0;perspective:1900px;perspective-origin:960px 420px}
#ring{position:absolute;left:960px;top:470px;width:0;height:0;transform-style:preserve-3d}
.card{position:absolute;width:300px;height:533px;left:-150px;top:-266px;border-radius:14px;overflow:hidden;backface-visibility:hidden;-webkit-box-reflect:below 14px linear-gradient(transparent 58%,rgba(255,255,255,.22))}
.card .shade{position:absolute;inset:0;background:#000}
#floor{position:absolute;left:0;right:0;top:744px;height:336px;background:linear-gradient(rgba(10,10,11,0),rgba(10,10,11,.0) 20%,rgba(10,10,11,.6))}

/* phone */
#phoneFrame{position:absolute;background:#1A1A1D;box-shadow:inset 0 0 0 1.5px #2C2C31}
#screen{position:absolute;overflow:hidden;background:#000}
#flipWrap{position:absolute;left:1040px;top:310px;width:620px;height:460px;perspective:1600px}
#flipper{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:26px;background:#141416;border:1px solid #26262A;backface-visibility:hidden;padding:52px 56px;display:flex;flex-direction:column;justify-content:space-between}
.face .k{font-size:22px;color:var(--mute);font-weight:500;letter-spacing:.04em}
.face.front .q{font-size:52px;color:#fff;font-weight:600;letter-spacing:-.02em;line-height:1.35}
.face.back{transform:rotateY(180deg)}
.face.back .k{color:var(--accent)}
.big2{font-family:'Inter';font-size:150px;font-weight:600;letter-spacing:-.05em;color:#fff;line-height:1}
.sub2{font-size:28px;color:var(--mute);font-weight:500}
.stat3{display:flex;flex-direction:column;gap:10px}
.stat3 div{font-size:64px;color:#fff;font-weight:600;letter-spacing:-.02em;display:flex;align-items:baseline;gap:12px}
.stat3 span{font-size:26px;color:var(--mute);font-weight:500}

/* stats */
#stRow{position:absolute;left:0;right:0;top:50%;transform:translateY(-54%);display:grid;grid-template-columns:repeat(3,440px);justify-content:center;gap:48px}
#stRow .col{text-align:center}
#stRow .n{font-family:"Inter";font-weight:600;font-size:176px;letter-spacing:-.05em;line-height:1;color:#fff}
#stRow .c{margin-top:22px;font-size:34px;color:var(--mute);font-weight:500}
.num{position:absolute;left:0;right:0;top:300px;text-align:center;font-family:"Inter";font-weight:600;font-size:340px;letter-spacing:-.05em;line-height:1;color:#fff}
.cap{position:absolute;left:0;right:0;top:680px;text-align:center;font-size:36px;color:var(--mute);font-weight:500;letter-spacing:.01em}

/* ticker */
#tick{position:absolute;top:50%;left:0;right:0;transform:translateY(-50%);display:flex;justify-content:center;align-items:center;gap:.28em;font-size:150px;font-weight:600;letter-spacing:-.02em;color:#fff;line-height:1.2}
#roller{height:1.2em;overflow:hidden;display:inline-block}
#rollIn{display:flex;flex-direction:column}
#rollIn div{height:1.2em}

/* logo */
#mark{position:absolute;width:240px;height:240px}
#word{position:absolute;display:flex;align-items:baseline;gap:26px;white-space:nowrap}
#word .en{font-family:"Inter";font-size:128px;font-weight:600;letter-spacing:-.045em;color:#fff}
#word .zh{font-size:84px;font-weight:600;color:#fff;letter-spacing:.02em}
#tagline{position:absolute;left:0;right:0;top:720px;text-align:center;font-size:40px;color:#9A9A9E;font-weight:500;letter-spacing:.04em}
#black{position:absolute;inset:0;background:#000;pointer-events:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><filter id="hblur" x="-30%" y="-10%" width="160%" height="120%"><feGaussianBlur id="hb" stdDeviation="0 0"/></filter></svg>
<div id="stage">
  <div id="paper"></div>

  <section class="sec" id="s-hook"><div class="cam" id="hookCam">
    <div id="hookLine">
      <span class="mask" id="w0"><span class="in"><span data-c="hook0pre"></span><span id="docWord"><span class="hl"></span><span class="t" data-c="hookWord"></span></span></span></span>
      <span class="mask" id="w1"><span class="in" data-c="hook1"></span></span>
      <span class="mask" id="w2"><span class="in" data-c="hook2"></span></span>
    </div>
  </div></section>

  <section class="sec" id="s-ui"><div id="uiFade"><div class="cam" id="uiCam">
    <div id="card">
      <div class="uihead"><div class="brand"><svg class="minimark" width="30" height="30"></svg><span data-c="product"></span></div><div class="r" data-c="uiAction"></div></div>
      <div class="lbl" data-c="dropLabel"></div>
      <div id="drop"><div id="chip"><span class="tag" id="chipTag" data-c="hookWord"></span><span data-c="file"></span></div><div class="r" data-c="dropHint"></div></div>
      <div class="row2">
        <div><div class="lbl" data-c="fieldLabel"></div><div id="field"><span id="typed"></span><span id="caret"></span></div></div>
        <div><div class="lbl" data-c="voiceLabel"></div><div class="chips"><div class="vchip" id="v0" data-c="voice0"></div><div class="vchip" data-c="voice1"></div><div class="vchip" data-c="voice2"></div></div></div>
      </div>
      <div class="foot"><div class="note" data-c="note"></div><div id="btn" data-c="button"></div></div>
    </div>
  </div></div></section>

  <div id="fly"><span class="tag" data-c="hookWord"></span></div>
  <svg id="cursor" viewBox="0 0 34 34"><path d="M5 3 L5 27 L11.2 21.4 L15.4 30.6 L19.6 28.7 L15.5 19.7 L23.8 19.4 Z" fill="#0B0B0C" stroke="#fff" stroke-width="2" stroke-linejoin="round"/></svg>
  <div id="iris"></div>

  <section class="sec" id="s-wall"><div class="cam" id="wallCam"><div id="tiles"></div><div id="scanTrail"></div><div id="scan"></div></div></section>

  <section class="sec" id="s-key"><div class="cam" id="keyCam">
    <div class="big" id="kt"><span class="line"><span class="mask"><span class="in" id="kt0" data-c="key1"></span></span></span><span class="line"><span class="mask"><span class="in" id="kt1"><span data-c="key2pre"></span><span id="ktA" data-c="key2accent"></span><span data-c="key2post"></span></span></span></span></div>
  </div></section>

  <section class="sec" id="s-car"><div id="carBlur"><div class="cam" id="carCam"><div id="carPersp"><div id="ring"></div></div><div id="floor"></div></div></div></section>

  <section class="sec" id="s-phone"><div class="cam" id="phoneCam">
    <div id="phoneFrame"></div><div id="screen"><img id="heroImg" alt=""></div>
    <div id="flipFade"><div id="flipWrap"><div id="flipper">
      <div class="face front"><div class="k" data-c="frontLabel"></div><div class="q" data-c="quote"></div><div class="k" data-c="file"></div></div>
      <div class="face back"><div class="k" data-c="backLabel"></div><div class="big2" data-c="backBig"></div><div class="sub2" data-c="backSub"></div></div>
    </div></div></div>
  </div></section>

  <section class="sec" id="s-stat"><div class="cam" id="statCam">
    <div id="stRow">
      <div class="col" id="st0"><div class="n"><span class="mask"><span class="in" data-c="stat0n"></span></span></div><div class="c"><span class="mask"><span class="in" data-c="stat0c"></span></span></div></div>
      <div class="col" id="st1"><div class="n"><span class="mask"><span class="in" data-c="stat1n"></span></span></div><div class="c"><span class="mask"><span class="in" data-c="stat1c"></span></span></div></div>
      <div class="col" id="st2"><div class="n"><span class="mask"><span class="in" data-c="stat2n"></span></span></div><div class="c"><span class="mask"><span class="in" data-c="stat2c"></span></span></div></div>
    </div>
  </div></section>

  <section class="sec" id="s-logo"><div class="cam" id="logoCam">
    <svg id="mark" viewBox="0 0 100 100"></svg>
    <div id="word"><span class="mask"><span class="in en" data-c="logoName"></span></span><span class="mask"><span class="in zh" data-c="logoSub"></span></span></div>
    <div id="tagline"><span class="mask"><span class="in" data-c="tagline"></span></span></div>
  </div></section>

  <div id="black"></div>
</div>

<script src="content.js"></script>
<script src="../build/grid.js"></script>
<script src="../build/clips.js"></script>
<script>
// ---------- grid (calibrated to kick hits, see grid.json) ----------
const GRID = window.GRID || {P: 0.5, total: 25, fadeStart: 24.1};
const C = window.CONTENT;
const B = GRID.P, BAR = B * 4;
const bt = (bar, beat = 1) => ((bar - 1) * 4 + (beat - 1)) * B;
const T = {
  w0: bt(1,1), w1: bt(1,2), w2: bt(1,3), hl: bt(1,4),
  morph: bt(2,1), field: bt(2,2), voice: bt(2,3), press: bt(2,4),
  drop: bt(3,1), clipIn: bt(3,2),
  wall: bt(4,1), scan: bt(4,2), win: [bt(4,3), bt(4,3) + B / 2, bt(4,4)],
  key: bt(5,1), key2: bt(5,2), keyA: bt(5,4),
  car: bt(6,1), whip: bt(7,3), phone: bt(8,1), flip: bt(8,4),
  st0: bt(10,1), st1: bt(10,2), st2: bt(10,3),
  logo: bt(11,3), play: bt(12,1), word: bt(12,2), tag: bt(12,3) + B / 2,
  end: GRID.fadeStart, total: GRID.total,
};
const CLIPS = window.CLIP_COUNTS || {};
// typing lands on sixteenths; longer strings type on thirty-seconds so they finish before the next beat
const TYPE_STEP = [...C.ui.typed].length <= 3 ? B / 4 : B / 8;
// Pacing manifest. cut = new shot, swap = replaces text in place, add = joins the frame.
// render.mjs lint checks: cuts >= 1 bar apart, swaps >= 2 beats apart, and every text stays
// on screen long enough to read (0.25 s + 0.1 s per CJK char / number / latin word).
const strip = h => String(h).replace(/<[^>]+>/g, ' ');
const PACING = [
  {t: T.w0, kind: 'cut', text: C.hook[0].pre + C.hook[0].word}, {t: T.w1, kind: 'add', text: C.hook[1]}, {t: T.w2, kind: 'add', text: C.hook[2]},
  {t: T.morph, kind: 'cut', text: ''}, {t: T.drop, kind: 'cut', text: ''},
  {t: T.key, kind: 'cut', text: C.key.line1}, {t: T.key2, kind: 'add', text: C.key.pre + C.key.accent + C.key.post},
  {t: T.car, kind: 'cut', text: ''},
  {t: T.phone, kind: 'cut', text: C.panel.frontLabel + ' ' + C.panel.quote.join(' ')}, {t: T.flip, kind: 'swap', text: [C.panel.backLabel, C.panel.big, C.panel.sub].join(' ')},
  ...C.stats.map((st, i) => ({t: [T.st0, T.st1, T.st2][i], kind: i ? 'add' : 'cut', text: st.n + ' ' + st.c})),
  {t: T.logo, kind: 'cut', text: ''}, {t: T.word, kind: 'add', text: C.logo.name + ' ' + C.logo.sub}, {t: T.tag, kind: 'add', text: C.logo.tagline},
].map(e => ({...e, text: strip(e.text)}));
window.PACING = PACING; window.BEAT = B;
const CUES = [
  ...[T.w0, T.w1, T.w2].map((t, i) => ({t, type: 'tick', f: 2400 + 200 * i, d: .05, gain: -8})),
  {t: T.hl + .06, type: 'swish', d: .3, f0: 1500, f1: 7000, peak: .55, gain: -12},
  {t: T.morph + .22, type: 'swish', d: .5, f0: 500, f1: 4000, peak: .5, gain: -12},
  ...[...C.ui.typed].map((_, i) => ({t: T.field + i * TYPE_STEP, type: 'key', gain: -11})),
  {t: T.voice, type: 'click', gain: -8}, {t: T.press, type: 'click', gain: -7},
  {t: T.drop, type: 'boom', gain: -3},
  {t: T.clipIn, type: 'tick', f: 1800, d: .08, gain: -14},
  {t: T.scan + B / 2, type: 'swish', d: .5, f0: 1200, f1: 8000, peak: .5, gain: -14},
  ...T.win.map((t, i) => ({t, type: 'ping', f: [1318.5, 1567.98, 1975.5][i], gain: -13})),
  {t: T.key, type: 'thud', gain: -9}, {t: T.key2, type: 'thud', gain: -12}, {t: T.car, type: 'thud', gain: -10},
  {t: (T.whip + T.phone) / 2, type: 'whoosh', d: .9, gain: -6},
  {t: T.phone, type: 'thud', gain: -9},
  {t: T.flip + .24, type: 'swish', d: .4, f0: 700, f1: 5000, peak: .5, gain: -13},
  {t: T.st0, type: 'thud', gain: -7}, {t: T.st1, type: 'thud', gain: -8}, {t: T.st2, type: 'thud', gain: -7},
  ...[T.logo, T.logo + B / 2, T.logo + B].map((t, i) => ({t, type: 'tick', f: 1600 + 100 * i, d: .06, gain: -12})),
  {t: T.play, type: 'ping', f: 1760, gain: -10},
  {t: T.word + .48, type: 'swish', d: .5, f0: 800, f1: 6000, peak: .5, gain: -15},
];
window.CUES = CUES;

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const P = (t, a, d) => clamp((t - a) / d);
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  outExpo: k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k),
  outCubic: k => 1 - Math.pow(1 - k, 3),
  outQuart: k => 1 - Math.pow(1 - k, 4),
  inOutCubic: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  inOutQuart: k => k < .5 ? 8 * k ** 4 : 1 - Math.pow(-2 * k + 2, 4) / 2,
  inOutSine: k => -(Math.cos(Math.PI * k) - 1) / 2,
};
const $ = id => document.getElementById(id);
const px = v => v.toFixed(3) + 'px';
function camScale(t, a, b, s0 = 1, s1 = 1.03) { return lerp(s0, s1, E.inOutSine(P(t, a, b - a))); }
function camRect(r, s) { return {x: 960 + (r.x - 960) * s, y: 540 + (r.y - 540) * s, w: r.w * s, h: r.h * s}; }
function rectOf(el) { const r = el.getBoundingClientRect(); return {x: r.left, y: r.top, w: r.width, h: r.height}; }
const ctr = r => ({x: r.x + r.w / 2, y: r.y + r.h / 2});
function reveal(el, t, a, d = .42, from = 108) { const k = E.outExpo(P(t, a, d)); el.style.transform = `translateY(${(1 - k) * from}%)`; return k; }
function show(id, on) { $(id).style.display = on ? 'block' : 'none'; }

// ---------- mark (placeholder geometry lives in content.js) ----------
const MARK = C.mark, MARK_BARS = MARK.bars, STROKE = MARK.stroke, DOT = MARK.dot;
const rr = (x, y, w, h, r) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}"/>`;
const MB = MARK.bounds; // visible box inside the 100-unit grid
function buildMarks() {
  document.querySelectorAll('.minimark').forEach(s => { s.setAttribute('viewBox', `${MB.x} ${MB.y} ${MB.w} ${MB.h}`); s.innerHTML =
    `<g fill="#0B0B0C">${MARK_BARS.map(([x, y, w]) => rr(x, y, w, STROKE, STROKE / 2)).join('')}</g><circle cx="${DOT.cx}" cy="${DOT.cy}" r="${DOT.r}" fill="var(--accent)"/>`; });
  $('mark').innerHTML = MARK_BARS.map(([x, y, w], i) => `<clipPath id="bc${i}"><rect id="bcr${i}" x="${x - 1}" y="${y - 1}" width="0" height="${STROKE + 2}"/></clipPath><g clip-path="url(#bc${i})" fill="#F2F3EF">${rr(x, y, w, STROKE, STROKE / 2)}</g>`).join('')
    + `<g id="playG"><circle cx="${DOT.cx}" cy="${DOT.cy}" r="${DOT.r}" fill="var(--accent)"/></g>`;
}
function fillContent() {
  const set = (k, v) => document.querySelectorAll(`[data-c="${k}"]`).forEach(el => { el.innerHTML = v; });
  const [h0, h1, h2] = C.hook;
  set('hook0pre', h0.pre); set('hookWord', h0.word); set('hook1', h1); set('hook2', h2);
  for (const k of ['product', 'uiAction', 'dropLabel', 'file', 'dropHint', 'fieldLabel', 'voiceLabel', 'note', 'button']) set(k, C.ui[k]);
  C.ui.voices.forEach((v, i) => set('voice' + i, v));
  set('key1', C.key.line1); set('key2pre', C.key.pre); set('key2accent', C.key.accent); set('key2post', C.key.post);
  set('frontLabel', C.panel.frontLabel); set('quote', C.panel.quote.join('<br>')); set('backLabel', C.panel.backLabel);
  set('backBig', C.panel.big); set('backSub', C.panel.sub);
  C.stats.forEach((st, i) => { set(`stat${i}n`, st.n); set(`stat${i}c`, st.c); if (st.accent) $('st' + i).querySelector('.n').style.color = 'var(--accent)'; });
  set('logoName', C.logo.name); set('logoSub', C.logo.sub); set('tagline', C.logo.tagline);
  if (C.accent) document.documentElement.style.setProperty('--accent', C.accent);
}

// ---------- clips ----------
const clipSrc = (id, f) => `../build/clips/${id}/${String(clamp(Math.floor(f), 0, (CLIPS[id] || 180) - 1) + 1).padStart(4, '0')}.jpg`;
const pending = [];
function setImg(img, src) {
  if (img.dataset.src === src) return;
  img.dataset.src = src; img.src = src;
  pending.push(img.decode().catch(() => {}));
}

// wall: 7 x 3, centre tile = row 1 col 3
const WALL = [
  ['c07', 'c04', 'c11', 'c01', 'c13', 'c06', 'c09'],
  ['c15', 'c10', 'c03', 'c14', 'c12', 'hero', 'c08'],
  ['c09', 'c01', 'c06', 'c13', 'c11', 'c03', 'c05'],
];
const TW = 162, TH = 288, GAP = 18;
const WIN = [[0, 1], [1, 5], [2, 2]];
const tiles = [];
function buildWall() {
  const W = 7 * TW + 6 * GAP, H = 3 * TH + 2 * GAP, x0 = 960 - W / 2, y0 = 540 - H / 2;
  const seen = {};
  WALL.forEach((row, r) => row.forEach((id, c) => {
    const d = document.createElement('div'); d.className = 'tile';
    const x = x0 + c * (TW + GAP), y = y0 + r * (TH + GAP);
    d.style.left = x + 'px'; d.style.top = y + 'px';
    d.innerHTML = '<img alt=""><div class="flash"></div><div class="dim"></div><div class="ring"></div>';
    $('tiles').appendChild(d);
    const off = (seen[id] = (seen[id] ?? -1) + 1) * 70 + (r * 7 + c) % 5 * 6;
    const wi = WIN.findIndex(([wr, wc]) => wr === r && wc === c);
    tiles.push({el: d, img: d.querySelector('img'), flash: d.querySelector('.flash'), dim: d.querySelector('.dim'), ring: d.querySelector('.ring'),
      id, off, r, c, cx: x + TW / 2, cy: y + TH / 2, win: wi, centre: r === 1 && c === 3});
  }));
}

// carousel
const CAR = ['hero', 'c05', 'c09', 'c03', 'c12', 'c07', 'c01', 'c10'];
const R = 560, STEP = 360 / CAR.length;
const cards = [];
function buildCarousel() {
  CAR.forEach((id, i) => {
    const d = document.createElement('div'); d.className = 'card';
    d.innerHTML = '<img alt=""><div class="shade"></div>';
    $('ring').appendChild(d);
    cards.push({el: d, img: d.querySelector('img'), shade: d.querySelector('.shade'), id, i, off: i * 17});
  });
}
// rotation: slow drift 30 -> 90 deg over bars 6-7a, whip 90 -> 360 lands the hero at 0 on the bar-8 downbeat
function theta(t) {
  const slow = lerp(30, 90, P(t, T.car, T.whip - T.car));
  return slow + 270 * E.inOutQuart(P(t, T.whip, T.phone - T.whip));
}

// ---------- measurements (layout only, taken once) ----------
const M = {};
function measure() {
  // hook at rest
  show('s-hook', true); show('s-ui', true);
  ['w0', 'w1', 'w2'].forEach(id => $(id).firstElementChild.style.transform = 'none');
  $('hookCam').style.transform = 'none'; $('uiCam').style.transform = 'none';
  M.docA = rectOf($('docWord'));
  M.chipB = rectOf($('chipTag'));
  M.field = rectOf($('field')); M.voice = rectOf($('v0')); M.btn = rectOf($('btn'));
  M.flyW = (() => { const f = $('fly'); f.style.display = 'block'; f.style.transform = 'none'; const r = rectOf(f.firstElementChild); f.style.display = 'none'; return r; })();
  show('s-hook', false); show('s-ui', false);
  // hero card rect at landing
  show('s-car', true); $('carCam').style.transform = 'none';
  layoutRing(360);
  M.heroCard = rectOf(cards[0].el);
  show('s-car', false);
}

// ---------- scene renderers ----------
const hookScale = t => camScale(t, 0, T.morph + .5, 1, 1.03);
const uiScale = t => camScale(t, T.morph, T.drop, 1.3, 1.33);

function renderHook(t) {
  $('hookCam').style.transform = `scale(${hookScale(t)})`;
  reveal($('w0').firstElementChild, t, T.w0);
  reveal($('w1').firstElementChild, t, T.w1);
  reveal($('w2').firstElementChild, t, T.w2);
  const hk = E.outExpo(P(t, T.hl, .36));
  $('docWord').querySelector('.hl').style.transform = `scaleX(${hk})`;
  // exit: the other words drop out of their masks as the hook word lifts away
  const ex = E.inOutCubic(P(t, T.morph, .22));
  if (t >= T.morph) {
    $('w1').firstElementChild.style.transform = `translateY(${ex * 110}%)`;
    $('w2').firstElementChild.style.transform = `translateY(${ex * 110}%)`;
    $('w0').querySelector('.in').style.transform = `translateY(${ex * 110}%)`;
    $('docWord').style.visibility = 'hidden';
  } else $('docWord').style.visibility = 'visible';
}

const MORPH_D = .44;
function renderFly(t) {
  const on = t >= T.morph && t < T.morph + MORPH_D;
  $('fly').style.display = on ? 'block' : 'none';
  if (!on) return;
  const k = E.inOutCubic(P(t, T.morph, MORPH_D));
  const A = camRect(M.docA, hookScale(T.morph)), Bt = camRect(M.chipB, uiScale(t));
  const x = lerp(A.x, Bt.x, k), y = lerp(A.y, Bt.y, k), w = lerp(A.w, Bt.w, k);
  $('fly').style.transform = `translate(${px(x)},${px(y)}) scale(${(w / M.flyW.w).toFixed(5)})`;
}

// cursor path in card space, converted through the ui camera
function cursorAt(t) {
  const f = ctr(M.field), v = ctr(M.voice), b = ctr(M.btn);
  const keys = [
    [T.morph + .05, 1500, 960],
    [T.field - .04, f.x - 120, f.y + 8],
    [T.voice - .26, f.x - 60, f.y + 10],
    [T.voice - .03, v.x - 10, v.y + 6],
    [T.press - .30, v.x + 20, v.y + 10],
    [T.press - .03, b.x - 14, b.y + 6],
  ];
  if (t <= keys[0][0]) return {x: keys[0][1], y: keys[0][2]};
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, x0, y0] = keys[i], [t1, x1, y1] = keys[i + 1];
    if (t <= t1) { const k = E.inOutCubic(P(t, t0, t1 - t0)); return {x: lerp(x0, x1, k), y: lerp(y0, y1, k)}; }
  }
  const l = keys[keys.length - 1]; return {x: l[1], y: l[2]};
}
const pressAt = (t, a) => { const d = t - a; return d >= 0 && d < .16 ? 1 - .14 * Math.sin(Math.PI * d / .16) : 1; };

function renderUI(t) {
  const s = uiScale(t);
  $('uiCam').style.transform = `scale(${s})`;
  $('uiFade').style.opacity = E.outCubic(P(t, T.morph + .16, .3));
  const tagOn = t >= T.morph + MORPH_D;
  $('chipTag').style.visibility = tagOn ? 'visible' : 'hidden';
  // typing on sixteenth notes (thirty-seconds for longer text)
  const chars = [...C.ui.typed]; let n = 0;
  for (let i = 0; i < chars.length; i++) if (t >= T.field + i * TYPE_STEP) n = i + 1;
  $('typed').textContent = chars.slice(0, n).join('');
  const focus = t >= T.field && t < T.voice;
  $('caret').style.opacity = focus ? 1 : 0;
  $('field').style.borderColor = focus ? '#0B0B0C' : '#DADCD5';
  const vk = E.outCubic(P(t, T.voice, .12));
  const v0 = $('v0');
  v0.style.background = vk > 0 ? `rgba(11,11,12,${vk})` : 'transparent';
  v0.style.color = vk > .5 ? '#fff' : '#0B0B0C';
  v0.style.borderColor = vk > 0 ? '#0B0B0C' : '#DADCD5';
  v0.style.transform = `scale(${pressAt(t, T.voice) * .4 + .6 * 1})`;
  const pk = E.outCubic(P(t, T.press, .14));
  const btn = $('btn');
  btn.style.background = pk > 0 ? '#C9F65A' : '#0B0B0C';
  btn.style.color = pk > 0 ? '#0B0B0C' : '#fff';
  btn.style.transform = `scale(${1 - .04 * Math.sin(Math.PI * P(t, T.press, .2))})`;
  // cursor
  const c = cursorAt(t), cc = camRect({x: c.x, y: c.y, w: 0, h: 0}, s);
  const cur = $('cursor');
  cur.style.display = t >= T.morph + .05 && t < T.drop + .2 ? 'block' : 'none';
  const click = Math.min(pressAt(t, T.field), pressAt(t, T.voice), pressAt(t, T.press));
  cur.style.transform = `translate(${px(cc.x - 4)},${px(cc.y - 3)}) scale(${click})`;
  cur.style.opacity = E.outCubic(P(t, T.morph + .05, .2));
}

function renderIris(t) {
  const on = t >= T.drop && t < T.clipIn + .02;
  $('iris').style.display = on ? 'block' : 'none';
  if (!on) return;
  const b = ctr(camRect(M.btn, uiScale(T.drop)));
  const Rmax = Math.hypot(Math.max(b.x, 1920 - b.x), Math.max(b.y, 1080 - b.y)) + 8;
  const r0 = M.btn.h * .5;
  const rad = tt => lerp(r0, Rmax, E.outCubic(P(tt, T.drop, T.clipIn - T.drop)));
  const r = rad(t);
  // analytic motion blur: feather the edge by the distance it travels within one sub-frame span
  const f = Math.max(1.2, Math.abs(rad(t + 1 / 240) - rad(t - 1 / 240)) * .38);
  const el = $('iris');
  Object.assign(el.style, {left: '0px', top: '0px', width: '1920px', height: '1080px', borderRadius: '0', transform: 'none', background: `radial-gradient(circle at ${b.x.toFixed(2)}px ${b.y.toFixed(2)}px, #0A0A0B ${Math.max(0, r - f).toFixed(2)}px, rgba(10,10,11,0) ${(r + f).toFixed(2)}px)`});
}

// wall: bar 3 shows the centre tile alone at 2.22x; bar 4 pulls back to the full wall
const WALL_IN = 640 / TH;
function renderWall(t) {
  const pull = E.inOutCubic(P(t, T.wall, T.scan - T.wall));
  const push = camScale(t, T.scan, T.key, 1, 1.035);
  const s = t < T.wall ? lerp(WALL_IN * .96, WALL_IN, E.outCubic(P(t, T.clipIn, T.wall - T.clipIn))) : lerp(WALL_IN, 1, pull) * push;
  $('wallCam').style.transform = `scale(${s.toFixed(5)})`;
  const scanK = E.inOutSine(P(t, T.scan, T.win[0] - T.scan));
  const x0 = 960 - (7 * TW + 6 * GAP) / 2 - 40, x1 = 1920 - x0;
  const sx = lerp(x0, x1, scanK), scanOn = t >= T.scan && t < T.win[0] + .06;
  $('scan').style.display = $('scanTrail').style.display = scanOn ? 'block' : 'none';
  $('scan').style.left = px(sx); $('scanTrail').style.left = px(sx - 220);
  $('scan').style.opacity = $('scanTrail').style.opacity = 1 - P(t, T.win[0], .06);
  for (const tl of tiles) {
    const f = tl.off + (t - T.clipIn) * 30;
    setImg(tl.img, clipSrc(tl.id, f));
    // reveal: centre first via mask, others open outward during the pull-back
    let vis;
    if (tl.centre) vis = E.outExpo(P(t, T.clipIn, .45));
    else { const dist = Math.hypot(tl.c - 3, (tl.r - 1) * 1.6); vis = E.outCubic(P(t, T.wall + .04 + dist * .035, .3)); }
    tl.el.style.clipPath = `inset(${((1 - vis) * 100).toFixed(2)}% 0 0 0 round 10px)`;
    tl.el.style.visibility = vis <= 0 ? 'hidden' : 'visible';
    // scan flash as the line passes
    const passT = T.scan + (T.win[0] - T.scan) * clamp((tl.cx - x0) / (x1 - x0));
    const since = t - passT;
    tl.flash.style.opacity = since >= 0 && since < .3 ? (.16 * (1 - since / .3)).toFixed(3) : 0;
    // winners ring + lift, losers dim
    let dim = 0, lift = 1, ring = 0;
    if (tl.win >= 0) { const k = E.outCubic(P(t, T.win[tl.win], .28)); ring = k; lift = 1 + .06 * k; }
    else dim = .8 * E.outCubic(P(t, T.win[0], .4));
    tl.dim.style.opacity = dim.toFixed(3); tl.ring.style.opacity = ring.toFixed(3);
    tl.el.style.transform = `scale(${lift.toFixed(4)})`;
    tl.el.style.zIndex = tl.win >= 0 ? 2 : 1;
  }
}

function renderKey(t) {
  $('keyCam').style.transform = `scale(${camScale(t, T.key, T.car, 1, 1.03)})`;
  reveal($('kt0'), t, T.key); reveal($('kt1'), t, T.key2);
  const a = E.outCubic(P(t, T.keyA, .16));
  $('ktA').style.color = `rgb(${lerp(255, 201, a)},${lerp(255, 246, a)},${lerp(255, 90, a)})`;
}

function layoutRing(th) {
  $('ring').style.transform = `rotateX(-4deg) rotateY(${(-th).toFixed(3)}deg)`;
  for (const c of cards) {
    const a = c.i * STEP;
    c.el.style.transform = `rotateY(${a}deg) translateZ(${R}px)`;
    const rel = ((a - th) % 360 + 540) % 360 - 180; // 0 = facing camera
    c.shade.style.opacity = (0.72 * Math.min(1, Math.abs(rel) / 110)).toFixed(3);
  }
}
function renderCar(t) {
  const th = theta(t);
  layoutRing(th);
  $('carCam').style.transform = `scale(${camScale(t, T.car, T.phone, 1, 1.05)})`;
  const dt = 1 / 240, vel = Math.abs(theta(t + dt) - theta(t - dt)) / (2 * dt); // deg/s
  const blur = Math.min(34, vel * .06);
  $('hb').setAttribute('stdDeviation', `${blur.toFixed(2)} 0`);
  $('carBlur').style.filter = blur > .4 ? 'url(#hblur)' : 'none';
  for (const c of cards) setImg(c.img, clipSrc(c.id, c.id === 'hero' ? (t - T.car) * 30 : c.off + (t - T.car) * 30));
}

const SCREEN = {w: 432, h: 768}, SCREEN_C = {x: 700, y: 540};
function renderPhone(t) {
  $('phoneCam').style.transform = `scale(${camScale(t, T.phone + .45, T.st0, 1, 1.025)})`;
  const k = E.inOutCubic(P(t, T.phone, .5));
  const A = M.heroCard, F = {x: SCREEN_C.x - SCREEN.w / 2, y: SCREEN_C.y - SCREEN.h / 2, w: SCREEN.w, h: SCREEN.h};
  const r = {x: lerp(A.x, F.x, k), y: lerp(A.y, F.y, k), w: lerp(A.w, F.w, k), h: lerp(A.h, F.h, k)};
  const sc = $('screen');
  Object.assign(sc.style, {left: px(r.x), top: px(r.y), width: px(r.w), height: px(r.h), borderRadius: px(lerp(14, 40, k))});
  const bz = 16 * (r.w / SCREEN.w), pf = $('phoneFrame');
  Object.assign(pf.style, {left: px(r.x - bz), top: px(r.y - bz), width: px(r.w + 2 * bz), height: px(r.h + 2 * bz), borderRadius: px(lerp(14, 40, k) + bz), opacity: E.outCubic(P(t, T.phone + .12, .4)).toFixed(3)});
  setImg($('heroImg'), clipSrc('hero', (t - T.car) * 30));
  // side panel: fade on the wrapper, flip on the preserve-3d child
  const fk = E.outCubic(P(t, T.phone + .3, .4));
  $('flipFade').style.opacity = fk.toFixed(3);
  $('flipFade').style.transform = `translateX(${((1 - fk) * 30).toFixed(2)}px)`;
  const flip = E.inOutCubic(P(t, T.flip, .48));
  $('flipper').style.transform = `rotateY(${(flip * 180).toFixed(3)}deg)`;
}

function renderStat(t) {
  $('statCam').style.transform = `scale(${camScale(t, T.st0, T.logo, 1, 1.03)})`;
  [T.st0, T.st1, T.st2].forEach((a, i) => {
    const ins = $('st' + i).querySelectorAll('.in');
    reveal(ins[0], t, a, .42); reveal(ins[1], t, a + B / 4, .4);
  });
}

function renderLogo(t) {
  $('logoCam').style.transform = `scale(${camScale(t, T.logo, T.total, 1, 1.035)})`;
  [T.logo, T.logo + B / 2, T.logo + B].forEach((a, i) => {
    const k = E.outExpo(P(t, a, .42));
    $('bcr' + i).setAttribute('width', (MARK_BARS[i][2] + 2) * k);
  });
  const pk = E.outExpo(P(t, T.play, .4));
  const ox = DOT.cx, oy = DOT.cy;
  $('playG').setAttribute('transform', `translate(${ox} ${oy}) scale(${pk.toFixed(4)}) translate(${-ox} ${-oy})`);
  // lockup: mark centred, then slides left as the wordmark opens
  const wk = E.inOutQuart(P(t, T.word, .46));
  const markS = 240, vis = MB.w / 100, gap = 60, wordW = M.wordW || 700, total = markS * vis + gap + wordW;
  const cx = lerp(960, 960 - total / 2 + markS * vis / 2, wk);
  const m = $('mark'), ms = lerp(1.55, 1, wk);
  const mcx = (MB.x + MB.w / 2) / 100, mcy = (MB.y + MB.h / 2) / 100;
  m.style.left = px(cx - markS * mcx); m.style.top = px(470 - markS * mcy);
  m.style.transformOrigin = `${markS * mcx}px ${markS * mcy}px`; m.style.transform = `scale(${ms.toFixed(4)})`;
  const w = $('word'); const ins = w.querySelectorAll('.in');
  w.style.left = px(960 - total / 2 + markS * vis + gap); w.style.top = px(470 - 86);
  reveal(ins[0], t, T.word + .28, .5); reveal(ins[1], t, T.word + .28 + B / 4, .45);
  reveal($('tagline').querySelector('.in'), t, T.tag, .5);
}

// ---------- frame ----------
// t = sub-frame time (motion); ft = frame centre time (which shot is on screen, so cuts stay hard)
async function renderAt(t, ft = t) {
  t = clamp(t, 0, T.total); ft = clamp(ft, 0, T.total); window.__ft = ft;
  const on = (a, b) => ft >= a && ft < b;
  const secs = {
    's-hook': on(0, T.morph + .26), 's-ui': on(T.morph, T.clipIn + .02), 's-wall': on(T.drop + .2, T.key),
    's-key': on(T.key, T.car), 's-car': on(T.car, T.phone), 's-phone': on(T.phone, T.st0),
    's-stat': on(T.st0, T.logo), 's-logo': on(T.logo, 99),
  };
  for (const [id, v] of Object.entries(secs)) { show(id, v); }
  $('paper').style.display = ft < T.clipIn + .02 ? 'block' : 'none';
  if (secs['s-hook']) renderHook(t);
  if (secs['s-ui']) renderUI(t); else $('cursor').style.display = 'none';
  renderFly(t); renderIris(t);
  if (secs['s-wall']) renderWall(t);
  if (secs['s-key']) renderKey(t);
  if (secs['s-car']) renderCar(t); else $('carBlur').style.filter = 'none';
  if (secs['s-phone']) renderPhone(t);
  if (secs['s-stat']) renderStat(t);
  if (secs['s-logo']) renderLogo(t);
  $('black').style.opacity = E.inOutSine(P(t, T.end, T.total - T.end - .12)).toFixed(4);
  // the hook section sits above the ui while the hook word leaves; keep the layering explicit
  $('s-hook').style.zIndex = 2; $('s-ui').style.zIndex = 1;
  const wait = pending.splice(0); await Promise.all(wait);
  await new Promise(r => requestAnimationFrame(() => r()));
}

window.ready = (async () => {
  await Promise.all(['400', '500', '600'].map(w => document.fonts.load(`${w} 40px Inter`)));
  await document.fonts.load('600 40px "PingFang SC"');
  await document.fonts.ready;
  fillContent(); buildMarks(); buildWall(); buildCarousel();
  // measure the lockup word width for centring
  show('s-logo', true); M.wordW = $('word').getBoundingClientRect().width; show('s-logo', false);
  measure();
  window.T = T;
  return true;
})();
window.renderAt = renderAt;
window.lintPacing = () => {
  const tokens = s => (s.match(/[\u4e00-\u9fff]|[0-9:%.]+|[A-Za-z]+/g) || []).length;
  const need = s => .25 + .1 * tokens(s), out = [];
  const ev = PACING.slice().sort((a, b) => a.t - b.t), cuts = ev.filter(e => e.kind === 'cut');
  for (let i = 1; i < cuts.length; i++) if (cuts[i].t - cuts[i - 1].t < BAR * .98) out.push(`cut ${cuts[i].t.toFixed(3)}s only ${(cuts[i].t - cuts[i - 1].t).toFixed(2)}s after the previous cut (min 1 bar ${BAR.toFixed(2)}s)`);
  for (let i = 0; i < ev.length; i++) {
    const e = ev[i];
    if (e.kind === 'swap') { const prev = ev[i - 1]; if (prev && e.t - prev.t < 2 * B * .98) out.push(`swap ${e.t.toFixed(3)}s only ${(e.t - prev.t).toFixed(2)}s after ${prev.kind} (min 2 beats)`); }
    if (!e.text) continue;
    // text leaves at the next cut, or at the next swap when it is itself the swapped content
    const gone = ev.find((n, j) => j > i && (n.kind === 'cut' || (n.kind === 'swap' && e.kind !== 'add'))) || {t: T.end + .5};
    const shown = gone.t - (e.t + .15);
    if (shown < need(e.text)) out.push(`"${e.text}" readable ${shown.toFixed(2)}s < ${need(e.text).toFixed(2)}s`);
  }
  return out;
};
